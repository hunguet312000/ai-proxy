services:
  literouter:
    build: .
    image: literouter:local
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:1457:1457"
      - "127.0.0.1:1456:1456"
    environment:
      LITEROUTER_SERVER_ADDR: ":8317"
      HOME: "/host-home"
      CLAUDE_CONFIG_DIR: "/host-home/.claude"
      CODEX_HOME: "/host-home/.codex"
      LITEROUTER_STORAGE_PATH: "/data/literouter.db"
      LITEROUTER_MASTER_KEY: "${LITEROUTER_MASTER_KEY:?Set LITEROUTER_MASTER_KEY to a base64-encoded 32-byte key}"
      LITEROUTER_API_TOKEN: "${LITEROUTER_API_TOKEN:?Set LITEROUTER_API_TOKEN to a strong random token}"
      LITEROUTER_OAUTH_REFRESH_INTERVAL: "1m"
      LITEROUTER_OAUTH_CALLBACK_CONTAINER: "true"
      # Stability profile for Claude CLI: sticky_soft affinity + pressure migrate,
      # no response cache, no prompt_cache_key injection. The context pipeline is ON
      # in aggressive mode: requests approaching their model's window get old
      # duplicate/superseded tool results collapsed and bulky old tool output
      # truncated before the LLM summary or trim stages — this is what stops agent
      # "Prompt is too long" failures. Cache compression stays "safe": the aggressive
      # cache pass also mutates recent turns and is subsumed by this pipeline.
      #
      # The compact-request model (fast /compact routing) is configured in the
      # dashboard (CLI tab → routing) and persists in the DB volume. Set
      # LITEROUTER_ROUTER_COMPACT_MODEL here only to pin it as infrastructure —
      # env wins over the dashboard at boot.
      LITEROUTER_ROUTER_STRATEGY: "sticky_soft"
      LITEROUTER_CACHE_RESPONSE_TTL: "15m"
      LITEROUTER_CACHE_RESPONSE_MAX_ENTRIES: "0"
      LITEROUTER_CACHE_COMPRESSION_MODE: "safe"
      LITEROUTER_CACHE_PROMPT_MIN_BYTES: "0"
      LITEROUTER_CONTEXT_ENABLED: "true"
      LITEROUTER_CONTEXT_MODE: "aggressive"
      LITEROUTER_CONTEXT_GUARD_ENABLED: "true"
      LITEROUTER_OPENAI_BASE_URL: "https://api.openai.com/v1"
      LITEROUTER_XAI_BASE_URL: "https://api.x.ai/v1"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      LITEROUTER_LOG_LEVEL: "${LITEROUTER_LOG_LEVEL:-info}"
    volumes:
      - literouter-data:/data
      # Host home so CLI Apply/Reset can write ~/.claude and ~/.codex like 9router.
      - ${HOME}:/host-home
      # Read-only, and only so the IDE product.json can be read where a provider
      # needs the installed version to match (Cursor no longer ships on this proxy).
      - /Applications:/host-apps:ro
    healthcheck:
      test: ["CMD", "/literouter", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  literouter-data:
