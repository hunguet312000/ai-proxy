services:
  literouter:
    build: .
    image: literouter:local
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:1457:1457"
      - "127.0.0.1:1456:1456"
      - "127.0.0.1:1458:1458"
    environment:
      LITEROUTER_SERVER_ADDR: ":8317"
      HOME: "/host-home"
      CLAUDE_CONFIG_DIR: "/host-home/.claude"
      CODEX_HOME: "/host-home/.codex"
      LITEROUTER_STORAGE_PATH: "/data/literouter.db"
      LITEROUTER_MASTER_KEY: "${LITEROUTER_MASTER_KEY:?Set LITEROUTER_MASTER_KEY to a base64-encoded 32-byte key}"
      LITEROUTER_API_TOKEN: "${LITEROUTER_API_TOKEN:?Set LITEROUTER_API_TOKEN to a strong random token}"
      LITEROUTER_OAUTH_REFRESH_INTERVAL: "1m"
      LITEROUTER_OAUTH_CALLBACK_CONTAINER: "true"
      # Stability profile for Claude CLI: sticky_soft affinity + pressure migrate,
      # no response cache, no prompt_cache_key injection, no context compact/summarize.
      LITEROUTER_ROUTER_STRATEGY: "sticky_soft"
      LITEROUTER_CACHE_RESPONSE_TTL: "15m"
      LITEROUTER_CACHE_RESPONSE_MAX_ENTRIES: "0"
      LITEROUTER_CACHE_COMPRESSION_MODE: "safe"
      LITEROUTER_CACHE_PROMPT_MIN_BYTES: "0"
      LITEROUTER_CONTEXT_ENABLED: "false"
      LITEROUTER_CONTEXT_GUARD_ENABLED: "true"
      LITEROUTER_OPENAI_BASE_URL: "https://api.openai.com/v1"
      LITEROUTER_XAI_BASE_URL: "https://api.x.ai/v1"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      XAI_API_KEY: "${XAI_API_KEY:-}"
      LITEROUTER_LOG_LEVEL: "info"
    volumes:
      - literouter-data:/data
      # Host home so CLI Apply/Reset can write ~/.claude and ~/.codex like 9router.
      - ${HOME}:/host-home
    healthcheck:
      test: ["CMD", "/literouter", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  literouter-data:
