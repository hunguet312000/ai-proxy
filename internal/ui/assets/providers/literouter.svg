<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LiteRouter">
  <defs>
    <linearGradient id="bg" x1="18" y1="4" x2="48" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="shine" x1="32" y1="4" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#shine)"/>
  <!-- routes -->
  <g stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity="0.95" filter="url(#soft)">
    <line x1="32" y1="32" x2="32" y2="16.5"/>
    <line x1="32" y1="32" x2="17.2" y2="41.5"/>
    <line x1="32" y1="32" x2="46.8" y2="41.5"/>
  </g>
  <!-- nodes -->
  <g fill="#fff" filter="url(#soft)">
    <circle cx="32" cy="16.5" r="4.4"/>
    <circle cx="17.2" cy="41.5" r="4.4"/>
    <circle cx="46.8" cy="41.5" r="4.4"/>
  </g>
  <g fill="#818cf8">
    <circle cx="32" cy="16.5" r="1.6"/>
    <circle cx="17.2" cy="41.5" r="1.6"/>
    <circle cx="46.8" cy="41.5" r="1.6"/>
  </g>
  <!-- hub -->
  <circle cx="32" cy="32" r="7.2" fill="#fff" filter="url(#soft)"/>
  <circle cx="32" cy="32" r="3.1" fill="#f97316"/>
</svg>
